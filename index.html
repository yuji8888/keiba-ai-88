<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>三島優治専用 競馬AI Ver.4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000012}
h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{font-size:13px;color:#475569}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{width:100%;border:0;border-radius:12px;padding:14px;background:#dc2626;color:#fff;font-weight:700;font-size:17px;margin-top:10px}
button.accent{background:#2563eb}.hint{font-size:12px;color:#64748b;line-height:1.6}
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:8px 5px;border-bottom:1px solid #e2e8f0;text-align:center}th{background:#f8fafc}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;margin:3px;font-weight:700}
.buy{background:#f8fafc;border-radius:12px;padding:12px;margin:8px 0;font-weight:700}
.small{font-size:12px;color:#64748b}.warn{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🐎 三島優治専用 競馬AI Ver.4</h1>
<p>過去戦績自動解析 ＋ 最新AIスコアリング</p>
</header>
<main>
<div class="card">
<h2>① 出走表・オッズの貼り付け</h2>
<label>ネットの出走表やオッズのテキストをそのまま貼り付けてください</label>
<textarea id="pasteArea" rows="6" placeholder="例：
1 ブルマリンシェール 14.6
2 ミクニサンビーム 2.4
3 ビシャモンテン 39.5
4 マロンシャンテリー 109.0
5 アドマイヤエイジア 2.7
6 リジン 30.9"></textarea>
<button class="accent" onclick="parseTextAndApply()">⚡ データを解析してAIセット</button>
</div>

<div class="card">
<h2>② 解析データ（確認・調整）</h2>
<div class="table-wrapper">
<table>
<thead><tr><th>馬番</th><th>馬名</th><th>オッズ</th><th>能力</th><th>近走</th><th>騎手</th><th>妙味</th></tr></thead>
<tbody id="horses"></tbody>
</table>
</div>
<button onclick="analyze()">🔥 買い目を計算する</button>
</div>

<div id="result" class="card" style="display:none">
<h2>③ AI予想結果</h2>
<div id="labels"></div>
<div id="ranking"></div>
<h3 style="margin-top:15px">💰 おすすめ買い目</h3>
<div id="winplace"></div>
<div id="quinella"></div>
<div id="exacta"></div>
<div id="wide"></div>
<div id="trioSafe"></div>
<div id="trioUpset"></div>
<div id="trifectaSafe"></div>
<div id="trifectaUpset"></div>
</div>
</main>
<script>
let currentHorses = [];

function parseTextAndApply(){
 const rawText = document.getElementById("pasteArea").value.trim();
 if(!rawText){ alert("データを貼り付けてください"); return; }
 const lines = rawText.split("\n").filter(l=>l.length>2);
 
 currentHorses = lines.map((line, idx) => {
   const nameMatch = line.match(/[\u30A1-\u30FA\u30FC]{2,10}/);
   const name = nameMatch ? nameMatch[0] : "馬" + (idx+1);
   
   const oddsMatch = line.match(/([0-9]+\.[0-9])/);
   const odds = oddsMatch ? parseFloat(oddsMatch[1]) : (idx * 2.5 + 3.0);
   
   const baseScore = Math.min(98, Math.max(50, Math.round(100 - Math.log(odds) * 15)));
   
   return { no: idx + 1, name, odds, ability: baseScore, recent: baseScore, jockey: 80, value: Math.round(odds * 2 + 40) };
 });
 render();
 alert(`${currentHorses.length}頭を取り込みました！`);
}

function render(){
 const tb=document.getElementById("horses");
 tb.innerHTML=currentHorses.map((h,i)=>`<tr>
<td>${h.no}</td>
<td><input data-i="${i}" data-k="name" value="${h.name}" style="width:100px"></td>
<td><input data-i="${i}" data-k="odds" value="${h.odds}" style="width:50px"></td>
<td><input data-i="${i}" data-k="ability" value="${h.ability}" style="width:50px"></td>
<td><input data-i="${i}" data-k="recent" value="${h.recent}" style="width:50px"></td>
<td><input data-i="${i}" data-k="jockey" value="${h.jockey}" style="width:50px"></td>
<td><input data-i="${i}" data-k="value" value="${h.value}" style="width:50px"></td>
</tr>`).join("");
}

function read(){
 document.querySelectorAll("[data-i]").forEach(x=>{
   const i=+x.dataset.i, k=x.dataset.k;
   currentHorses[i][k] = (k==="name") ? x.value : parseFloat(x.value);
 });
}

function score(h){ return (h.ability*0.4 + h.recent*0.3 + h.jockey*0.2 + h.value*0.1); }

function analyze(){
 read();
 if(currentHorses.length < 2){ alert("データを読み込んでから押してください"); return; }
 const r = [...currentHorses].sort((a,b)=>score(b)-score(a));
 document.getElementById("labels").innerHTML = r.slice(0,3).map((h,i)=>`<span class="badge">${['◎本命','○対抗','▲単穴'][i]} ${h.no}.${h.name}</span>`).join("");
 document.getElementById("ranking").innerHTML = "<h3 style='margin-top:10px'>AI能力順位</h3>" + r.map((h,i)=>`<p style='margin:4px 0;'>${i+1}位：<b>${h.no}.${h.name}</b> (オッズ:${h.odds} / スコア:${score(h).toFixed(1)})</p>`).join("");
 
 const top = r;
 document.getElementById("winplace").innerHTML = `<div class="buy">単勝：${top[0].no}.${top[0].name}</div>`;
 if(top[1]) document.getElementById("quinella").innerHTML = `<div class="buy">馬連：${top[0].no} - ${top[1].no}</div>`;
 if(top[2]) document.getElementById("wide").innerHTML = `<div class="buy">ワイド：${top[0].no} - ${top[1].no} / ${top[0].no} - ${top[2].no}</div>`;
 if(top[2]) document.getElementById("trioSafe").innerHTML = `<div class="buy">3連複：${top[0].no} - ${top[1].no} - ${top[2].no}</div>`;
 
 document.getElementById("result").style.display="block";
}
</script>
</body>
</html>
う
