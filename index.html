<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬AI Money Management Engine v9.0 (高配当特化版)</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, select, textarea, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; padding: 12px; font-size: 16px; }
    button:hover { background-color: #219150; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
    .ticket-box { background: #fff; border: 2px solid #34495e; border-radius: 6px; padding: 12px; }
    .high-return-box { border: 2px solid #e74c3c; background-color: #fdf2e9; }
    .unit-info { font-size: 13px; color: #c0392b; font-weight: bold; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1fr dashed #ccc; }
    .ticket-list { list-style: none; padding: 0; margin: 0; font-family: monospace; font-size: 14px; line-height: 1.6; }
    .summary-bar { background-color: #2c3e50; color: white; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 15px; }
  </style>
</head>
<body>

  <h1>競馬AI Engine v9.0 (資金配分＆高配当30万狙い)</h1>

  <div class="card">
    <h3>① 資金・条件設定</h3>
    <div class="grid">
      <div>
        <label>合計予算 (円)</label>
        <input type="number" id="totalBudget" value="10000" step="1000">
      </div>
      <div>
        <label>馬場状態</label>
        <select id="trackCondition">
          <option value="good">良馬場</option>
          <option value="soft">重・不良馬場</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>② 出走表データ貼り付け</h3>
    <textarea id="pasteArea" rows="6" placeholder="馬名, 枠, 馬番, 斤量, 近走平均着順, 前走上がり3F, 道悪適性(1/0), 単勝オッズ"></textarea>
    <button onclick="parseAndAnalyze()">買い目算出＆資金配分を実行</button>
  </div>

  <div id="summaryBar" class="summary-bar" style="display:none;"></div>

  <div class="card">
    <h3>③ AI推せん買い目一覧</h3>
    <div class="ticket-grid" id="ticketContainer">
      <!-- 買い目が自動挿入されます -->
    </div>
  </div>

  <script>
    function parseAndAnalyze() {
      const budget = parseInt(document.getElementById('totalBudget').value) || 10000;
      const text = document.getElementById('pasteArea').value.trim();
      if (!text) { alert('出走表データを入力してください'); return; }

      const lines = text.split('\n');
      const horses = [];
      
      lines.forEach(line => {
        const cols = line.split(/,|\t/).map(c => c.trim());
        if (cols.length < 8) return;
        
        const name = cols[0], gate = cols[1], num = cols[2], 
              weight = parseFloat(cols[3]), rank = parseFloat(cols[4]), 
              last3f = parseFloat(cols[5]), wet = parseInt(cols[6]), 
              odds = parseFloat(cols[7]);
        
        // 独自Value計算（指数 ÷ オッズ）
        let score = 50 - (rank * 3.5) + (57.0 - weight) * 3 + (34.5 - last3f) * 10;
        if (document.getElementById('trackCondition').value === 'soft' && wet === 1) {
          score += 5; // 道悪適性加算
        }
        const value = (score / odds).toFixed(1);
        horses.push({ name, num, value: parseFloat(value), odds });
      });

      if (horses.length < 4) { alert('正しい形式で4頭以上のデータを入れてください'); return; }

      // Valueの高い順にソート
      horses.sort((a, b) => b.value - a.value);

      const h1 = horses[0].num; // 軸馬
      const h2 = horses[1].num;
      const h3 = horses[2].num;
      const h4 = horses[3] ? horses[3].num : h2;
      const h5 = horses[4] ? horses[4].num : h3;
      const p = [h2, h3, h4, h5];

      // 単勝20倍以上の「高Value超・穴馬」を抽出（いなければ4番手以降の馬）
      const holeHorses = horses.filter(h => h.odds >= 20.0).sort((a, b) => b.value - a.value);
      const superHole = holeHorses.length > 0 ? holeHorses[0].num : h5;

      // --- 各券種の買い目作成 ---
      
      // 1. 馬連 (5点)
      const umaren = [`${h1} - ${h2}`, `${h1} - ${h3}`, `${h1} - ${h4}`, `${h1} - ${h5}`, `${h2} - ${h3}`];

      // 2. 馬単 (5点)
      const umatan = [`${h1} → ${h2}`, `${h1} → ${h3}`, `${h1} → ${h4}`, `${h1} → ${h5}`, `${h2} → ${h1}`];

      // 3. ワイド (5点)
      const wide = [`${h1} - ${h2}`, `${h1} - ${h3}`, `${h1} - ${h4}`, `${h1} - ${h5}`, `${h2} - ${h3}`];

      // 4. 3連複 軸1頭相手4頭流し (6点)
      const sanrenpuku = [
        `${h1} - ${h2} - ${h3}`, `${h1} - ${h2} - ${h4}`, `${h1} - ${h2} - ${h5}`,
        `${h1} - ${h3} - ${h4}`, `${h1} - ${h3} - ${h5}`, `${h1} - ${h4} - ${h5}`
      ];

      // 5. 3連単 裏表マルチ厳選 (15点)
      const sanrentan = [
        `${h1} → ${h2} → ${h3}`, `${h1} → ${h3} → ${h2}`, `${h1} → ${h2} → ${h4}`, `${h1} → ${h4} → ${h2}`,
        `${h1} → ${h3} → ${h4}`, `${h1} → ${h4} → ${h3}`, `${h2} → ${h1} → ${h3}`, `${h3} → ${h1} → ${h2}`,
        `${h2} → ${h1} → ${h4}`, `${h3} → ${h1} → ${h4}`, `${h4} → ${h1} → ${h2}`, `${h2} → ${h3} → ${h1}`,
        `${h3} → ${h2} → ${h1}`, `${h2} → ${h4} → ${h1}`, `${h3} → ${h4} → ${h1}`
      ];

      // 6. 【一発逆転】30万オーバー狙い 3連単 (6点)
      const highReturn3Rentan = [
        `${superHole} → ${h1} → ${h2}`,  // 超穴馬激走1着（30万〜100万オーバー）
        `${superHole} → ${h1} → ${h3}`, 
        `${h1} → ${superHole} → ${h2}`,  // 超穴馬2着突入（10万〜50万）
        `${h1} → ${superHole} → ${h3}`,
        `${h2} → ${superHole} → ${h1}`,
        `${h3} → ${superHole} → ${h1}`
      ];

      // 資金計算
      const totalPoints = 5 + 5 + 5 + 6 + 15 + 6; // 全42点
      const unitStake = Math.max(100, Math.floor((budget / totalPoints) / 100) * 100);
      const actualTotalCost = unitStake * totalPoints;

      // サマリー表示
      const summaryEl = document.getElementById('summaryBar');
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `<strong>【計算結果】</strong> 全<b>${totalPoints}点</b> / 1点あたり推奨: <b>${unitStake.toLocaleString()}円</b> （購入合計: ${actualTotalCost.toLocaleString()}円）`;

      // 画面描画
      const container = document.getElementById('ticketContainer');
      container.innerHTML = '';

      const configs = [
        { name: "馬連", count: 5, items: umaren, isHigh: false },
        { name: "馬単", count: 5, items: umatan, isHigh: false },
        { name: "ワイド", count: 5, items: wide, isHigh: false },
        { name: "3連複", count: 6, items: sanrenpuku, isHigh: false },
        { name: "3連単", count: 15, items: sanrentan, isHigh: false },
        { name: "🔥 30万オーバー狙い (3連単)", count: 6, items: highReturn3Rentan, isHigh: true }
      ];

      configs.forEach(cfg => {
        const div = document.createElement('div');
        div.className = `ticket-box ${cfg.isHigh ? 'high-return-box' : ''}`;
        div.innerHTML = `
          <h4>${cfg.name} (${cfg.count}点)</h4>
          <div class="unit-info">1点あたり: ${unitStake.toLocaleString()}円 (計 ${(unitStake * cfg.count).toLocaleString()}円)</div>
          <ul class="ticket-list">
            ${cfg.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
