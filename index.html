<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬AI Money Management Engine v10.0 (フォーメーション表示対応版)</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    input, select, textarea, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; padding: 12px; font-size: 16px; }
    button:hover { background-color: #219150; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
    .ticket-box { background: #fff; border: 2px solid #34495e; border-radius: 6px; padding: 12px; }
    .high-return-box { border: 2px solid #e74c3c; background-color: #fdf2e9; }
    .custom-hole-box { border: 2px solid #8e44ad; background-color: #f4ecf7; }
    .unit-info { font-size: 13px; color: #c0392b; font-weight: bold; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px dashed #ccc; }
    .formation-card { background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 14px; line-height: 1.8; margin-bottom: 10px; }
    .formation-title { font-weight: bold; color: #2c3e50; margin-bottom: 4px; font-size: 13px; text-decoration: underline; }
    .summary-bar { background-color: #2c3e50; color: white; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 15px; }
  </style>
</head>
<body>

  <h1>競馬AI Engine v10.0 (フォーメーション入力対応版)</h1>

  <div class="card">
    <h3>① 資金・条件・気になる穴馬の設定</h3>
    <div class="grid">
      <div>
        <label>合計予算 (円)</label>
        <input type="number" id="totalBudget" value="10000" step="1000">
      </div>
      <div>
        <label>馬場状態</label>
        <select id="trackCondition">
          <option value="good">良馬場</option>
          <option value="soft">重・不良馬場</option>
        </select>
      </div>
      <div>
        <label>気になる穴馬 (馬番/任意)</label>
        <input type="text" id="customHole" placeholder="例: 6 や 14">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>② 出走表データ貼り付け</h3>
    <textarea id="pasteArea" rows="6" placeholder="馬名, 枠, 馬番, 斤量, 近走平均着順, 前走上がり3F, 道悪適性(1/0), 単勝オッズ"></textarea>
    <button onclick="parseAndAnalyze()">買い目算出＆資金配分を実行</button>
  </div>

  <div id="summaryBar" class="summary-bar" style="display:none;"></div>

  <div class="card">
    <h3>③ AI推せん買い目（フォーメーション指示書）</h3>
    <div class="ticket-grid" id="ticketContainer">
      <!-- 買い目が自動挿入されます -->
    </div>
  </div>

  <script>
    function parseAndAnalyze() {
      const budget = parseInt(document.getElementById('totalBudget').value) || 10000;
      const text = document.getElementById('pasteArea').value.trim();
      const customHoleInput = document.getElementById('customHole').value.trim();

      if (!text) { alert('出走表データを入力してください'); return; }

      const lines = text.split('\n');
      const horses = [];
      
      lines.forEach(line => {
        const cols = line.split(/,|\t/).map(c => c.trim());
        if (cols.length < 8) return;
        
        const name = cols[0], gate = cols[1], num = cols[2], 
              weight = parseFloat(cols[3]), rank = parseFloat(cols[4]), 
              last3f = parseFloat(cols[5]), wet = parseInt(cols[6]), 
              odds = parseFloat(cols[7]);
        
        let score = 50 - (rank * 3.5) + (57.0 - weight) * 3 + (34.5 - last3f) * 10;
        if (document.getElementById('trackCondition').value === 'soft' && wet === 1) {
          score += 5;
        }
        const value = (score / odds).toFixed(1);
        horses.push({ name, num, value: parseFloat(value), odds });
      });

      if (horses.length < 4) { alert('正しい形式で4頭以上のデータを入れてください'); return; }

      // Valueの高い順にソート
      horses.sort((a, b) => b.value - a.value);

      const h1 = horses[0].num; // 軸馬
      const h2 = horses[1].num;
      const h3 = horses[2].num;
      const h4 = horses[3] ? horses[3].num : h2;
      const h5 = horses[4] ? horses[4].num : h3;

      // AI選定の超穴馬
      const holeHorses = horses.filter(h => h.odds >= 20.0).sort((a, b) => b.value - a.value);
      const superHole = holeHorses.length > 0 ? holeHorses[0].num : h5;

      // --- 各券種のフォーメーション定義 ---
      
      // 1. 馬連 (5点)
      const umarenFormations = [
        { title: "主軸流し (4点)", r1: [h1], r2: [h2, h3, h4, h5] },
        { title: "対抗同士押さえ (1点)", r1: [h2], r2: [h3] }
      ];

      // 2. 馬単 (5点)
      const umatanFormations = [
        { title: "本線頭 (4点)", r1: [h1], r2: [h2, h3, h4, h5] },
        { title: "逆転押さえ (1点)", r1: [h2], r2: [h1] }
      ];

      // 3. ワイド (5点)
      const wideFormations = [
        { title: "主軸流し (4点)", r1: [h1], r2: [h2, h3, h4, h5] },
        { title: "対抗同士押さえ (1点)", r1: [h2], r2: [h3] }
      ];

      // 4. 3連複 (6点)
      const sanrenpukuFormations = [
        { title: "軸1頭ながし/フォーメーション (6点)", r1: [h1], r2: [h2, h3, h4, h5], r3: [h2, h3, h4, h5] }
      ];

      // 5. 3連単 (15点)
      const sanrentanFormations = [
        { title: "パターン①: 本線軸頭 (6点)", r1: [h1], r2: [h2, h3, h4], r3: [h2, h3, h4] },
        { title: "パターン②: 対抗頭・軸2着 (6点)", r1: [h2, h3], r2: [h1], r3: [h2, h3, h4] },
        { title: "パターン③: 穴頭・軸3着 (3点)", r1: [h2, h3, h4], r2: [h2, h3, h4], r3: [h1] }
      ];

      // 6. 🔥 30万オーバー狙い 3連単 (6点)
      const highReturnFormations = [
        { title: "超高配当 A: 穴馬1着固定 (2点)", r1: [superHole], r2: [h1], r3: [h2, h3] },
        { title: "超高配当 B: 穴馬2着挟み (2点)", r1: [h1], r2: [superHole], r3: [h2, h3] },
        { title: "超高配当 C: 軸対抗→穴馬2着 (2点)", r1: [h2, h3], r2: [superHole], r3: [h1] }
      ];

      // --- 【追加】指定穴馬用フォーメーション (計5点) ---
      let customHoleFormations = [];
      if (customHoleInput) {
        const cH = customHoleInput;
        customHoleFormations = [
          { title: "ワイド (1点)", r1: [h1], r2: [cH] },
          { title: "3連複 (1点)", r1: [h1], r2: [h2], r3: [cH] },
          { title: "3連単 1着指定 (1点)", r1: [cH], r2: [h1], r3: [h2] },
          { title: "3連単 2着指定 (1点)", r1: [h1], r2: [cH], r3: [h2] },
          { title: "3連単 3着指定 (1点)", r1: [h1], r2: [h2], r3: [cH] }
        ];
      }

      // 資金計算
      const customCount = customHoleInput ? 5 : 0;
      const totalPoints = 5 + 5 + 5 + 6 + 15 + 6 + customCount;
      const unitStake = Math.max(100, Math.floor((budget / totalPoints) / 100) * 100);
      const actualTotalCost = unitStake * totalPoints;

      // サマリー表示
      const summaryEl = document.getElementById('summaryBar');
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `<strong>【計算結果】</strong> 全<b>${totalPoints}点</b> / 1点あたり推奨: <b>${unitStake.toLocaleString()}円</b> （購入合計: ${actualTotalCost.toLocaleString()}円）`;

      // 画面描画
      const container = document.getElementById('ticketContainer');
      container.innerHTML = '';

      const configs = [
        { name: "馬連", count: 5, forms: umarenFormations, type: "normal", is3: false },
        { name: "馬単", count: 5, forms: umatanFormations, type: "normal", is3: false },
        { name: "ワイド", count: 5, forms: wideFormations, type: "normal", is3: false },
        { name: "3連複", count: 6, forms: sanrenpukuFormations, type: "normal", is3: true },
        { name: "3連単", count: 15, forms: sanrentanFormations, type: "normal", is3: true },
        { name: "🔥 30万オーバー狙い (3連単)", count: 6, forms: highReturnFormations, type: "high", is3: true }
      ];

      if (customCount > 0) {
        configs.push({
          name: `🎯 直感特注馬 [${customHoleInput}番] フォーメーション`,
          count: customCount,
          forms: customHoleFormations,
          type: "custom",
          is3: true
        });
      }

      configs.forEach(cfg => {
        const div = document.createElement('div');
        let boxStyle = 'ticket-box';
        if (cfg.type === 'high') boxStyle += ' high-return-box';
        if (cfg.type === 'custom') boxStyle += ' custom-hole-box';

        div.className = boxStyle;

        let formsHTML = '';
        cfg.forms.forEach(f => {
          const r1Str = f.r1.join(', ');
          const r2Str = f.r2.join(', ');
          
          if (cfg.is3 && f.r3) {
            const r3Str = f.r3.join(', ');
            formsHTML += `
              <div class="formation-card">
                <div class="formation-title">${f.title}</div>
                <div><b>1頭目(1着):</b> [ ${r1Str} ]</div>
                <div><b>2頭目(2着):</b> [ ${r2Str} ]</div>
                <div><b>3頭目(3着):</b> [ ${r3Str} ]</div>
              </div>
            `;
          } else {
            formsHTML += `
              <div class="formation-card">
                <div class="formation-title">${f.title}</div>
                <div><b>1頭目(1着):</b> [ ${r1Str} ]</div>
                <div><b>2頭目(2着):</b> [ ${r2Str} ]</div>
              </div>
            `;
          }
        });

        div.innerHTML = `
          <h4>${cfg.name} (${cfg.count}点)</h4>
          <div class="unit-info">1点あたり: ${unitStake.toLocaleString()}円 (計 ${(unitStake * cfg.count).toLocaleString()}円)</div>
          ${formsHTML}
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
